[package]
name = "monitoaster"
version = "0.0.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"
description = "画面の一区画を見張り、条件を満たしたら演出・音・通知で知らせるWindows用の常駐ツール"
repository = "https://github.com/okakanatto/Monitoaster"
publish = false
build = "build.rs"

[lib]
name = "monitoaster"
path = "src/lib.rs"

[[bin]]
name = "Monitoaster"
path = "src/main.rs"

# 直接依存は windows / serde / serde_json の3つだけ(S-12)。
# 追加・入れ替えには docs/spec.md の改訂が必要。build-dependencies も増やさない。
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Linux上で OS非依存モジュールの単体テストを回せるよう、windows は cfg(windows) に限る。
# features は使う分だけ足す(exeサイズとビルド時間のため)。
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation"] }

# S-11: unsafe は src/platform 以下だけ。platform だけが #![allow(unsafe_code)] を書ける。
# forbid ではなく deny にしているのは、platform で allow できるようにするため。
# 他のモジュールは各ファイル先頭に #![forbid(unsafe_code)] を置く。
[lints.rust]
unsafe_code = "deny"

# 8章と S-10。overflow-checks はリリースでも有効にする。
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
overflow-checks = true
